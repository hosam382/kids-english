<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kids English</title>
<meta name="description" content="تعلم الإنجليزي للأطفال الصغار بالصور والصوت">
<meta name="theme-color" content="#ffb84d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#fff6d9; --ink:#3a2a1a; --soft:#8a6d4b; --card:#ffffff; --shadow:0 6px 0 rgba(120,80,20,.16);
  --r:28px; --gap:14px;
  font-family: ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  background:
   radial-gradient(circle at 10% 8%,#ffe7a3 0 90px,transparent 91px),
   radial-gradient(circle at 95% 30%,#ffd9e6 0 70px,transparent 71px),
   radial-gradient(circle at 5% 85%,#d8f3ff 0 80px,transparent 81px), var(--bg);
  background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.ar{font-family:"Segoe UI",Tahoma,"Geeza Pro",system-ui,sans-serif;direction:rtl}
#app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:64px}
.round{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:34px;display:grid;place-items:center;flex:none}
.round:active,.tile:active,.card:active,.opt:active,.big:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 rgba(120,80,20,.16)}
.round.small{width:48px;height:48px;font-size:24px;opacity:.8}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:26px;letter-spacing:.3px}
.brand b:nth-child(2){color:#e8304a}.brand b:nth-child(3){color:#2f6ff0}
.title{font-weight:900;font-size:28px;text-align:center;flex:1;line-height:1.05}
.title small{display:block;font-size:15px;font-weight:700;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.big{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;margin-bottom:var(--gap);padding:18px;border-radius:var(--r);
  background:linear-gradient(135deg,#ff6b8b,#ffa24c);color:#fff;box-shadow:0 6px 0 #c94d4d;font-weight:900;font-size:30px}
.big .e{font-size:58px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.big small{display:block;font-size:16px;opacity:.95}
.tile{aspect-ratio:1/1;border-radius:var(--r);box-shadow:0 6px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.15)}
.tile .e{font-size:clamp(56px,17vw,84px);line-height:1.1;text-shadow:none}
.tile .n{font-weight:900;font-size:21px}
.tile .ar{font-size:14px;font-weight:700;opacity:.95}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px;border:5px solid var(--b,#ffd46b);position:relative;overflow:hidden}
.card .w{font-weight:900;font-size:22px;margin-top:4px}
.card .ar{font-size:14px;color:var(--soft);font-weight:700}
.nowords .w,.nowords .ar.m{display:none}
.vis{flex:1;display:grid;place-items:center;width:100%;min-height:0;overflow:hidden}
.emo{font-size:clamp(64px,22vw,104px);line-height:1.05}
.blob{width:72%;aspect-ratio:1/1;border-radius:58% 42% 55% 45%/48% 58% 42% 52%;background:var(--c);box-shadow:inset -8px -10px 0 rgba(0,0,0,.12),inset 8px 8px 0 rgba(255,255,255,.35)}
.blob.white{border:3px solid #e3dccb}
.svg{width:78%;height:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.num{font-size:clamp(48px,15vw,84px);font-weight:900;line-height:1;color:var(--c)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:92px;margin-top:2px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.let{font-size:clamp(44px,13vw,72px);font-weight:900;line-height:1;color:var(--c)}
.let+.emo{font-size:clamp(26px,8vw,44px);line-height:1.15}
.card.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.08) rotate(-3deg)}60%{transform:scale(.97) rotate(2deg)}100%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
/* game */
.ask{display:flex;justify-content:center;margin:0 0 18px}
.ask button{width:min(110px,14vh);height:min(110px,14vh);border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:60px;display:grid;place-items:center;animation:ring 2s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:var(--shadow),0 0 0 0 rgba(255,164,76,.5)}50%{box-shadow:var(--shadow),0 0 0 16px rgba(255,164,76,0)}}
.opts{display:flex;flex-direction:column;align-items:center;gap:18px}
.opts.n2 .opt{width:min(72vw,33vh,340px)}.opts.n3 .opt{width:min(62vw,23vh,300px)}
@media (orientation:landscape){.opts{flex-direction:row;justify-content:center}.opts .opt{width:min(30vw,60vh)!important}}
.opt{aspect-ratio:1/1;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);border:6px solid var(--b,#ffd46b);display:grid;place-items:center;padding:10px}
.opt .vis{height:100%}.opt .emo{font-size:min(30vw,15vh,150px)}.opt .blob{width:80%}.opt .num{font-size:min(28vw,14vh)}
.opt.no{animation:wig .45s ease}
@keyframes wig{20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.opt.hint{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.05);box-shadow:0 0 0 10px rgba(255,210,31,.6),var(--shadow)}}
.opt.yes{animation:win .8s ease;border-color:#26c25a}
@keyframes win{30%{transform:scale(1.15) rotate(-4deg)}60%{transform:scale(1.05) rotate(3deg)}}
.stars{background:#fff;border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);font-weight:900;font-size:24px;min-width:90px;text-align:center}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.fx span{position:absolute;top:-60px;font-size:40px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.cheer{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);font-size:140px;z-index:10;pointer-events:none;animation:cheer 1.4s ease forwards}
@keyframes cheer{25%{transform:translate(-50%,-50%) scale(1.15)}40%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
/* parent sheet */
.sheet{position:fixed;inset:0;background:rgba(40,25,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:#fff;width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);max-height:88vh;overflow:auto;-webkit-user-select:text;user-select:text}
.sheet h2{margin:0 0 10px;font-size:24px}
.sheet p,.sheet li{font-size:17px;line-height:1.7;margin:6px 0}
.sheet ol{padding-inline-start:22px;margin:4px 0 10px}
.sheet h3{margin:16px 0 4px;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn{background:#ffb84d;color:#3a2a1a;font-weight:800;border-radius:16px;padding:12px 18px;font-size:17px;box-shadow:0 4px 0 #d18a2a}
.btn.alt{background:#eef2f7;box-shadow:0 4px 0 #c9d2dd}
.ok{color:#1c8a43;font-weight:800}
</style>
</head>

    <p>🎈 <b>اللعبة:</b> يسمع «Where is the …؟» ويضغط الصورة الصحيحة. ما فيه وقت ولا خسارة، وكل إجابة صحيحة تعطيه نجمة ⭐.</p>
    <div class="row">
      <button class="btn alt" id="tw">${showWords ? "إخفاء الكلمات المكتوبة" : "إظهار الكلمات المكتوبة"}</button>
      ${installEvt && !standalone ? '<button class="btn" id="inst">📲 ثبّت التطبيق</button>' : ""}
    </div>
    <p id="off">⏳ جاري تجهيز الأصوات للعمل بدون إنترنت…</p>
    ${standalone ? "" : `<h3>📲 إضافته للشاشة الرئيسية</h3>
    <p><b>آيفون:</b> افتحه في Safari ← زر المشاركة ⬆️ ← «إضافة إلى الشاشة الرئيسية».</p>
    <p><b>أندرويد:</b> افتحه في Chrome ← القائمة ⋮ ← «تثبيت التطبيق».</p>`}
    <p style="color:#8a6d4b;font-size:14px">بدون إعلانات وبدون روابط خارجية. شغّل الصوت في الجوال 🔊</p>
    <div class="row"><button class="btn" id="close">تم ✓</button></div>
  </div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) el.remove(); };
  el.querySelector("#close").onclick = () => el.remove();
  el.querySelector("#tw").onclick = () => { showWords = !showWords; store.set("words", showWords); el.remove(); route(); };
  const inst = el.querySelector("#inst"); if (inst) inst.onclick = async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; el.remove(); };
  offlineReady().then(ok => { const p = el.querySelector("#off"); if (p) p.innerHTML = ok ? '<span class="ok">✅ جاهز يشتغل بدون إنترنت</span>' : "⏳ افتحه مرة وهو متصل بالإنترنت لين تتحمّل الأصوات، بعدها يشتغل بدون إنترنت."; });
}

/* ---------- router ---------- */
function go(h) { if (("#" + h) === location.hash || (!h && !location.hash)) route(); else location.hash = h; }
function route() {
  const h = location.hash.slice(1);
  if (!h.startsWith("g/")) game = null;
  if (h.startsWith("c/")) category(h.slice(2));
  else if (h.startsWith("g/")) startGame(catById[h.slice(2)] ? h.slice(2) : "all");
  else home();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
