<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kids English</title>
<meta name="description" content="تعلم الإنجليزي للأطفال الصغار بالصور والصوت">
<meta name="theme-color" content="#ffc93c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="font-kids.woff2" as="font" type="font/woff2" crossorigin>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kids English">
<style>
@font-face{font-family:Kids;src:url(font-kids.woff2) format("woff2");font-weight:400 800;font-display:swap}
:root{
  --ink:#4a2c12; --soft:#9a7046; --sky1:#bfe7ff; --sky2:#eaf7ff; --ground:#fff3cf;
  --h1:#9fe08a; --h2:#6fcf6a; --h3:#49b655; --accent:#ff6b35; --sun:#ffd34d;
  --r:30px; --gap:14px; --ease:cubic-bezier(.34,1.56,.64,1);
  font-family:Kids,"Segoe UI Rounded","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);background:var(--sky1)}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;font-weight:700;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.ar{direction:rtl;font-weight:600}
.pic{display:inline-block;background-repeat:no-repeat;width:1em;height:1em;vertical-align:middle;image-rendering:auto}

/* ---------- world ---------- */
#world{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--ground));transition:background 1.2s}
#world .sun{position:absolute;right:-90px;top:-90px;font-size:200px;animation:spin 90s linear infinite;filter:drop-shadow(0 0 30px rgba(255,210,80,.6))}
#world .cloud{position:absolute;font-size:120px;opacity:.95;animation:drift var(--t,60s) linear infinite;filter:drop-shadow(0 10px 10px rgba(80,120,180,.12))}
#world .hills{position:absolute;left:0;right:0;bottom:0;height:34vh;min-height:220px}
#world .hills svg{position:absolute;inset:0;width:100%;height:100%}
#world .deco{position:absolute;bottom:0;transform-origin:50% 100%}
#world .fly{position:absolute;font-size:46px;animation:flutter 7s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes flutter{0%,100%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(30px,-22px) rotate(6deg)}50%{transform:translate(70px,-6px) rotate(-4deg)}75%{transform:translate(28px,14px) rotate(8deg)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
@media (prefers-reduced-motion:reduce){#world *{animation:none!important}}

/* ---------- layout ---------- */
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 28px);min-height:100vh}
.screen{animation:scrIn .42s var(--ease) both}
.screen.out{animation:scrOut .2s ease-in both}
@keyframes scrIn{from{opacity:0;transform:scale(.94) translateY(16px)}to{opacity:1;transform:none}}
@keyframes scrOut{to{opacity:0;transform:scale(.96)}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:72px;margin-bottom:10px}
.orb{width:68px;height:68px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:40px;
  background:radial-gradient(circle at 35% 30%,#fff,#f3f6ff 55%,#d9e2f5);box-shadow:0 6px 0 #b9c6e0,0 10px 18px rgba(60,80,140,.18),inset 0 -4px 0 rgba(150,170,210,.25);transition:transform .12s,box-shadow .12s}
.orb:active,.tile:active,.card:active,.opt:active,.cta:active{transform:translateY(5px) scale(.97);box-shadow:0 1px 0 #b9c6e0,0 3px 8px rgba(60,80,140,.15)}
.orb.small{width:52px;height:52px;font-size:30px}
.t3{font-weight:800;letter-spacing:.3px;color:#fff;text-shadow:0 1px 0 #d9b78b,0 2px 0 #c9a476,0 3px 0 #b99262,0 4px 0 #a37f52,0 5px 0 #8f6b42,0 8px 12px rgba(90,50,10,.35)}
.title{flex:1;text-align:center;line-height:1}
.title .en{font-size:40px}.title .ar{font-size:17px;color:var(--soft);margin-top:6px}
.wordmark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:30px;line-height:1}
.wordmark b:nth-child(2){color:#e8304a;text-shadow:0 2px 0 #b31c33}.wordmark b:nth-child(3){color:#2f6ff0;text-shadow:0 2px 0 #1f4fb3}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}

/* ---------- home ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:4px 0 12px;min-height:150px}
.bubble{position:relative;background:#fff;border-radius:26px;padding:14px 18px 12px;box-shadow:0 8px 0 #dfe6f5,0 12px 22px rgba(60,80,140,.14);font-size:22px;line-height:1.15;flex:1;max-width:360px;text-align:left}
.bubble small{display:block;font-size:16px;color:var(--soft);font-weight:600;margin-top:4px}
.bubble:after{content:"";position:absolute;right:-12px;bottom:26px;border:14px solid transparent;border-left-color:#fff;border-right:0}
.chick{position:relative;width:132px;height:132px;flex:none;font-size:124px;display:grid;place-items:center;transform-origin:50% 100%;animation:idle 2.6s ease-in-out infinite;filter:drop-shadow(0 12px 10px rgba(120,80,0,.25))}
.chick.sm{width:92px;height:92px;font-size:86px}
.chick .pic{transform-origin:50% 100%}
.chick.hop .pic{animation:hop .55s var(--ease)}
.chick.jump .pic{animation:jump .9s cubic-bezier(.3,1.4,.5,1)}
.chick.no .pic{animation:shake .55s ease}
.chick.talk .pic{animation:talk .35s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(.98,1.03)}}
@keyframes hop{0%{transform:scale(1)}30%{transform:translateY(-26px) scale(1.06,.94) rotate(-6deg)}60%{transform:translateY(0) scale(.94,1.06)}100%{transform:scale(1)}}
@keyframes jump{0%{transform:scale(1)}20%{transform:scale(1.15,.85)}45%{transform:translateY(-70px) scale(.92,1.1) rotate(-12deg)}70%{transform:translateY(0) scale(1.1,.9) rotate(6deg)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
@keyframes talk{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.97) rotate(2deg)}}
.cta{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;margin-bottom:var(--gap);padding:14px 18px;border-radius:999px;color:#fff;font-size:34px;line-height:1;
  background:linear-gradient(180deg,#ffb13b,#ff7a1a);box-shadow:0 9px 0 #c74f0b,0 14px 24px rgba(200,90,20,.3),inset 0 3px 0 rgba(255,255,255,.45);text-shadow:0 3px 0 rgba(150,60,0,.45)}
.cta .pic{font-size:60px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2));animation:idle 2s ease-in-out infinite}
.cta small{display:block;font-size:17px;margin-top:6px;opacity:.95}
.tile{position:relative;aspect-ratio:1/1;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 10px 14px;color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 80%,#000 8%));
  box-shadow:0 9px 0 color-mix(in srgb,var(--c) 70%,#000),0 16px 26px color-mix(in srgb,var(--c) 40%,transparent),inset 0 3px 0 rgba(255,255,255,.5);
  transition:transform .12s,box-shadow .12s;animation:popIn .6s var(--ease) both;animation-delay:var(--d,0s)}
.tile .pic{font-size:clamp(84px,24vw,118px);margin-bottom:auto;margin-top:-10px;filter:drop-shadow(0 12px 10px rgba(0,0,0,.28));transition:transform .2s}
.tile .n{font-size:26px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.25);line-height:1}
.tile .ar{font-size:15px;opacity:.95;margin-top:4px}
.tile .shine{position:absolute;left:14px;top:10px;width:40%;height:22%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
@keyframes popIn{from{opacity:0;transform:scale(.3) translateY(40px)}to{opacity:1;transform:none}}

/* ---------- category ---------- */
.card{position:relative;background:linear-gradient(180deg,#fff,#fdf7ec);border-radius:var(--r);aspect-ratio:1/1.12;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 8px 10px;
  box-shadow:0 8px 0 var(--b,#ffd46b),0 14px 22px rgba(120,80,20,.14),inset 0 0 0 4px #fff;border:3px solid var(--b,#ffd46b);
  animation:popIn .55s var(--ease) both;animation-delay:var(--d,0s);transition:transform .12s,box-shadow .12s}
.card .vis{flex:1;display:grid;place-items:center;width:100%;min-height:0;overflow:visible}
.card .pic{font-size:clamp(64px,22vw,104px);filter:drop-shadow(0 10px 8px rgba(120,80,20,.25))}
.card .w{font-size:22px;font-weight:800;margin-top:4px;line-height:1.1}
.card .ar{font-size:14px;color:var(--soft)}
.nowords .w,.nowords .ar.m{display:none}
.card.bump .vis{animation:bump .6s var(--ease)}
@keyframes bump{0%{transform:scale(1)}25%{transform:scale(1.18,.86) translateY(6px)}50%{transform:scale(.95,1.08) translateY(-18px)}75%{transform:scale(1.04,.98) translateY(0)}100%{transform:scale(1)}}
.say{position:absolute;left:50%;top:-10px;transform:translate(-50%,0);background:#fff;color:var(--accent);font-size:30px;font-weight:800;padding:8px 18px 6px;border-radius:999px;
  box-shadow:0 6px 0 #ffd0b8,0 10px 16px rgba(120,80,20,.18);pointer-events:none;white-space:nowrap;animation:sayUp 1.4s ease forwards;z-index:3}
@keyframes sayUp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.08)}35%{transform:translate(-50%,-14px) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
.spark{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:var(--sc,#ffd34d);pointer-events:none;animation:spark .7s ease-out forwards;z-index:2}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
/* shapes / numbers / letters */
.svg{width:76%;height:auto;filter:drop-shadow(0 10px 8px rgba(120,80,20,.22))}
.num{font-size:clamp(56px,16vw,86px);font-weight:800;line-height:1;color:var(--c);text-shadow:0 2px 0 color-mix(in srgb,var(--c),#000 25%),0 4px 0 color-mix(in srgb,var(--c),#000 35%),0 6px 0 color-mix(in srgb,var(--c),#000 45%),0 10px 12px rgba(0,0,0,.25)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;max-width:112px;margin-top:2px}
.dots .pic{font-size:19px}
.let{font-size:clamp(44px,12.5vw,66px);font-weight:800;line-height:1;color:var(--c);text-shadow:0 2px 0 color-mix(in srgb,var(--c),#000 25%),0 4px 0 color-mix(in srgb,var(--c),#000 40%),0 8px 10px rgba(0,0,0,.22)}
.letrow{display:flex;align-items:center;justify-content:center;gap:8px}
.letrow .pic{font-size:clamp(40px,11vw,58px)}
.fam{position:relative;width:1em;height:1em;font-size:inherit}
.fam .pic{position:absolute;font-size:.56em}
.fam .pic:nth-child(1){left:0;top:.05em}.fam .pic:nth-child(2){right:0;top:.05em}.fam .pic:nth-child(3){left:.12em;bottom:0}.fam .pic:nth-child(4){right:.12em;bottom:0}

/* ---------- game ---------- */
.gtop{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 10px}
.ask{position:relative;background:#fff;border-radius:28px;padding:10px 20px;box-shadow:0 8px 0 #dfe6f5,0 12px 22px rgba(60,80,140,.14);display:flex;align-items:center;gap:12px;font-size:26px;min-height:76px}
.ask:after{content:"";position:absolute;left:-12px;bottom:22px;border:14px solid transparent;border-right-color:#fff;border-left:0}
.ask .pic{font-size:46px}
.wave{display:flex;gap:4px;align-items:center;height:34px}
.wave i{width:6px;border-radius:3px;background:var(--accent);height:10px;animation:wave 1s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
.ask.quiet .wave i{animation:none;height:8px;background:#e5d9c8}
@keyframes wave{0%,100%{height:10px}50%{height:32px}}
.stars{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 16px 6px 10px;box-shadow:0 6px 0 #dfe6f5,0 10px 18px rgba(60,80,140,.14);font-size:28px;font-weight:800}
.stars .pic{font-size:40px}
.stars.bump{animation:bump .5s var(--ease)}
.prog{display:flex;gap:5px;margin-left:4px}
.prog i{width:12px;height:12px;border-radius:50%;background:#e8dcc8;transition:background .3s,transform .3s}
.prog i.on{background:#ffb703;transform:scale(1.25);box-shadow:0 0 0 3px rgba(255,183,3,.3)}
.opts{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:6px}
.opts.n2 .opt{width:min(74vw,34vh,360px)}.opts.n3 .opt{width:min(66vw,24vh,320px)}
@media (orientation:landscape){.opts{flex-direction:row;justify-content:center}.opts .opt{width:min(30vw,62vh)!important}}
.opt{position:relative;aspect-ratio:1/1;background:linear-gradient(180deg,#fff,#fdf7ec);border-radius:36px;display:grid;place-items:center;padding:10px;border:4px solid var(--b,#ffd46b);
  box-shadow:0 10px 0 var(--b,#ffd46b),0 18px 28px rgba(120,80,20,.16);animation:popIn .5s var(--ease) both;animation-delay:var(--d,0s);transition:transform .12s,box-shadow .12s}
.opt .pic{font-size:min(34vw,16vh,170px);filter:drop-shadow(0 14px 10px rgba(120,80,20,.25))}
.opt .num{font-size:min(30vw,15vh,150px)}.opt .let{font-size:min(34vw,16vh,160px)}
.opt .svg{width:82%}
.opt.no{animation:wig .5s ease}
@keyframes wig{20%{transform:translateX(-12px) rotate(-4deg)}40%{transform:translateX(12px) rotate(4deg)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.opt.hint{animation:hint 1s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.06) translateY(-8px);box-shadow:0 18px 0 var(--b),0 0 0 12px rgba(255,210,31,.45),0 26px 30px rgba(120,80,20,.2)}}
.opt.yes{border-color:#2dc653;box-shadow:0 10px 0 #2dc653,0 0 0 10px rgba(45,198,83,.25),0 18px 28px rgba(45,198,83,.3);animation:win .9s var(--ease)}
.opt.yes .pic,.opt.yes .num,.opt.yes .let,.opt.yes .svg{animation:bump .7s var(--ease)}
@keyframes win{30%{transform:scale(1.12) rotate(-3deg)}60%{transform:scale(1.04) rotate(2deg)}}
.opts.leave .opt{animation:leave .25s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translateY(40px) scale(.9)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.flystar{position:fixed;z-index:10;font-size:54px;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.cheer{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);font-size:170px;z-index:10;pointer-events:none;animation:cheer 1.5s ease forwards;filter:drop-shadow(0 16px 14px rgba(0,0,0,.25))}
@keyframes cheer{25%{transform:translate(-50%,-50%) scale(1.15) rotate(-6deg)}40%{transform:translate(-50%,-50%) scale(1) rotate(0)}85%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.balloon{position:fixed;bottom:-160px;font-size:120px;z-index:10;pointer-events:none;animation:rise 3.2s ease-in forwards;filter:drop-shadow(0 10px 10px rgba(0,0,0,.2))}
@keyframes rise{to{transform:translateY(-130vh) rotate(var(--rot,8deg))}}

/* ---------- parent sheet ---------- */
.sheet{position:fixed;inset:0;background:rgba(40,25,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet>div{background:#fff;width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);max-height:88vh;overflow:auto;-webkit-user-select:text;user-select:text;animation:up .4s var(--ease)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h2{margin:0 0 10px;font-size:26px}
.sheet p,.sheet li{font-size:17px;line-height:1.7;margin:6px 0;font-weight:600}
.sheet h3{margin:16px 0 4px;font-size:19px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn{background:linear-gradient(180deg,#ffc93c,#ffa726);color:#4a2c12;font-weight:800;border-radius:16px;padding:12px 18px;font-size:17px;box-shadow:0 4px 0 #d18a2a}
.btn.alt{background:#eef2f7;box-shadow:0 4px 0 #c9d2dd}
.ok{color:#1c8a43;font-weight:800}
</style>
</head>
<body>
<div id="world"></div>
<div id="app"></div>
<canvas id="fx"></canvas>

function pic(id, extra = "") {

  const [sheet, i, n] = m; const pos = n > 1 ? (i * 100 / (n - 1)) : 0;

/* ---------- sound ---------- */
let ctx = null, cur = null, token = 0, fxGain = null;
const bufs = {}, pend = {};
function ensureCtx() {

  ctx = new AC(); fxGain = ctx.createGain(); fxGain.gain.value = 0.55; fxGain.connect(ctx.destination);

}

}
["pointerdown", "touchend", "click"].forEach(ev => document.addEventListener(ev, unlock, true));
function loadSnd(n) {
  if (bufs[n]) return Promise.resolve(bufs[n]);
  if (!pend[n]) {
    const c = ensureCtx();
    pend[n] = fetch("snd-" + n + ".mp3").then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(ab => new Promise((res, rej) => c.decodeAudioData(ab, res, rej))).then(b => (bufs[n] = b))

  }

}
function stop() { if (cur) { try { cur.onended = null; cur.stop(); } catch (e) {} cur = null; } }
async function say(n, key, onstart) {
  const my = ++token; stop();
  const seg = DATA.snd[n] && DATA.snd[n][key]; if (!seg || !ensureCtx()) return;
  let b; try { b = await loadSnd(n); } catch (e) { return; }
  if (my !== token) return;
  if (ctx.state !== "running") { try { await ctx.resume(); } catch (e) {} }
  const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); cur = s;
  onstart && onstart(seg[1]);
  return new Promise(res => { s.onended = () => { if (cur === s) cur = null; res(); }; s.start(0, seg[0], seg[1]); });
}
async function fx(name) {
  const seg = DATA.snd.misc && DATA.snd.misc["fx:" + name]; if (!seg || !ensureCtx()) return;
  let b; try { b = await loadSnd("misc"); } catch (e) { return; }
  const s = ctx.createBufferSource(); s.buffer = b; s.connect(fxGain); s.start(0, seg[0], seg[1]);

/* ---------- game ---------- */
let game = null;
function startGame(scope) {
  stop(); theme(scope === "all" ? "#ffb703" : catById[scope].hue);
  game = { scope, stars: store.get("stars", 0), streak: 0, last: null, cat: null, target: null, misses: 0, busy: false };
  render(`
  <div class="bar">
    <button class="orb" id="home" aria-label="Home">${pic("home")}</button>
    <div class="stars" id="stars">${pic("star")}<span id="sc">${game.stars}</span><span class="prog" id="prog">${"<i></i>".repeat(5)}</span></div>
    <button class="orb" id="back" aria-label="Back">${scope === "all" ? pic("shapes") : pic(catById[scope].tile)}</button>
  </div>
  <div class="gtop">${chickEl("sm")}<button class="ask quiet" id="ask" aria-label="Listen">${pic("speaker")}<span class="wave"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i></span></button></div>
  <div class="opts" id="opts"></div>`);
  setTimeout(() => {
    document.getElementById("home").onclick = () => { fx("whoosh"); go(""); };
    document.getElementById("back").onclick = () => { fx("whoosh"); go(scope === "all" ? "" : "c/" + scope); };
    document.getElementById("ask").onclick = () => { if (game) { chickDo("hop"); speak(game.cat.id, "q:" + game.target.id); } };
    document.getElementById("chick").onclick = () => { if (game) { chickDo("hop"); speak(game.cat.id, "q:" + game.target.id); } };
    prog();
    speak("misc", "play").then(() => round());
  }, reduced ? 0 : 170);
}
function prog() { document.querySelectorAll("#prog i").forEach((d, i) => d.classList.toggle("on", i < game.stars % 5)); }
function pick(a, n, not) { const p = a.filter(x => x !== not), out = []; while (out.length < n && p.length) out.push(p.splice(Math.floor(Math.random() * p.length), 1)[0]); return out; }
function round() {
  if (!game || location.hash.indexOf("#g/") !== 0) return;
  const g = game;
  g.cat = g.scope === "all" ? DATA.cats[Math.floor(Math.random() * DATA.cats.length)] : catById[g.scope];
  const items = g.cat.items;
  g.target = pick(items, 1, g.last)[0]; g.last = g.target;
  const n = g.streak >= 4 ? 3 : 2;
  const choices = [g.target, ...pick(items, n - 1, g.target)].sort(() => Math.random() - .5);
  g.misses = 0; g.busy = false;
  const box = document.getElementById("opts"); box.className = "opts n" + n;
  box.innerHTML = choices.map((it, k) => `<button class="opt" data-id="${it.id}" style="--b:${BORDERS[(k + g.streak) % BORDERS.length]};--d:${k * 0.08}s">${gameVis(g.cat, it, items.indexOf(it))}</button>`).join("");
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b));
  loadSnd(g.cat.id).catch(() => {});
  speak(g.cat.id, "q:" + g.target.id);
}
async function answer(b) {
  const g = game; if (!g || g.busy) return;
  if (b.dataset.id === g.target.id) {
    g.busy = true; g.streak++; g.stars++; store.set("stars", g.stars);
    b.classList.add("yes"); fx("win"); chickDo("jump"); confetti(b);
    flyStar(b).then(() => { fx("ding"); const s = document.getElementById("stars"); if (s) { s.classList.remove("bump"); void s.offsetWidth; s.classList.add("bump"); } document.getElementById("sc").textContent = g.stars; prog(); });
    const five = g.stars % 5 === 0;
    if (five) setTimeout(celebrate, 700);
    await speak("misc", five ? "five" : "p" + (1 + Math.floor(Math.random() * 6)));
    await speak(g.cat.id, "w:" + g.target.id);
    const box = document.getElementById("opts"); if (box) box.classList.add("leave");
    setTimeout(round, five ? 900 : 320);
  } else {
    g.misses++;
    b.classList.remove("no"); void b.offsetWidth; b.classList.add("no");
    fx("nope"); chickDo("no");
    if (g.misses >= 2) document.querySelector(`.opt[data-id="${g.target.id}"]`).classList.add("hint");
    await speak("misc", "again");
    if (game === g && !g.busy) speak(g.cat.id, "q:" + g.target.id);
  }
}
function flyStar(from) {
  return new Promise(res => {
    const a = from.getBoundingClientRect(), tgt = document.getElementById("stars"); if (!tgt) return res();
    const t = tgt.getBoundingClientRect();
    const s = document.createElement("div"); s.className = "flystar"; s.innerHTML = pic("gstar");
    s.style.left = (a.left + a.width / 2 - 27) + "px"; s.style.top = (a.top + a.height / 2 - 27) + "px"; document.body.appendChild(s);
    const dx = t.left + 30 - (a.left + a.width / 2), dy = t.top + 20 - (a.top + a.height / 2);
    const anim = s.animate([{ transform: "translate(0,0) scale(.6)", opacity: 0 }, { transform: "translate(0,-40px) scale(1.4)", opacity: 1, offset: .25 },
      { transform: `translate(${dx * .5}px,${dy * .5 - 120}px) scale(1.1)`, offset: .6 }, { transform: `translate(${dx}px,${dy}px) scale(.5)`, opacity: 1 }],
      { duration: reduced ? 1 : 900, easing: "cubic-bezier(.3,.7,.3,1)", fill: "forwards" });
    anim.onfinish = () => { s.remove(); res(); };
  });
}
function celebrate() {
  fx("fanfare");
  const big = document.createElement("div"); big.className = "cheer"; big.innerHTML = pic("trophy"); document.body.appendChild(big);
  setTimeout(() => big.remove(), 1600);
  for (let i = 0; i < 6; i++) {
    const b = document.createElement("div"); b.className = "balloon"; b.innerHTML = pic(i % 2 ? "balloon" : "party");
    b.style.left = (8 + i * 15) + "vw"; b.style.animationDelay = (i * 0.18) + "s"; b.style.setProperty("--rot", (i % 2 ? 12 : -12) + "deg");
    if (i % 2) b.style.filter = `hue-rotate(${i * 60}deg) drop-shadow(0 10px 10px rgba(0,0,0,.2))`;
    document.body.appendChild(b); b.addEventListener("animationend", () => b.remove());
  }
}
/* confetti on canvas */
const cv = document.getElementById("fx"), cx2 = cv.getContext("2d"); let parts = [], raf = 0;
function confetti(from) {
  const r = from.getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx2.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const pal = ["#ff5a5f", "#ffb703", "#2dc653", "#3a86ff", "#ff7ac1", "#9b4dff", "#fff"];
  for (let i = 0; i < (reduced ? 20 : 70); i++) {
    const a = Math.random() * Math.PI * 2, v = 6 + Math.random() * 9;
    parts.push({ x: x0, y: y0, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, g: .32, s: 6 + Math.random() * 8, c: pal[i % pal.length], rot: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 70 + Math.random() * 40, k: i % 3 });
  }
  if (!raf) tick();
}
function tick() {
  cx2.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.rot += p.vr; p.life--;
    cx2.save(); cx2.translate(p.x, p.y); cx2.rotate(p.rot); cx2.globalAlpha = Math.min(1, p.life / 25); cx2.fillStyle = p.c;
    if (p.k === 0) cx2.fillRect(-p.s / 2, -p.s / 3, p.s, p.s / 1.5);
    else if (p.k === 1) { cx2.beginPath(); cx2.arc(0, 0, p.s / 2, 0, 7); cx2.fill(); }
    else { cx2.beginPath(); for (let i = 0; i < 5; i++) { const a = i * 1.2566 - 1.57, b = a + .628; cx2.lineTo(Math.cos(a) * p.s / 2, Math.sin(a) * p.s / 2); cx2.lineTo(Math.cos(b) * p.s / 5, Math.sin(b) * p.s / 5); } cx2.fill(); }
    cx2.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!raf) cx2.clearRect(0, 0, innerWidth, innerHeight);
}

/* ---------- router ---------- */
function go(h) { if (("#" + h) === location.hash || (!h && !location.hash)) route(); else location.hash = h; }
function route() {
